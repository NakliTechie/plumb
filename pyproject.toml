[project]
name = "plumb"
version = "0.0.1"
description = "A plumb line for borrowed taxonomies: audit placement, place the unplaceable, split the sinks."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
place = ["gliner2[local]>=2.0,<3", "torch>=2.6,<3", "scikit-learn>=1.6,<2", "protobuf>=4,<7", "sentencepiece>=0.2,<1"]
split = ["scikit-learn>=1.6,<2", "numpy>=2,<3", "torch>=2.6,<3", "transformers>=4.57,<5", "protobuf>=4,<7", "sentencepiece>=0.2,<1"]
dev = ["pytest", "scikit-learn>=1.6,<2", "numpy>=2,<3"]

[project.scripts]
plumb = "plumb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
