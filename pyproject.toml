[project]
name = "plumb"
version = "0.0.1"
description = "A plumb line for borrowed taxonomies: audit placement, place the unplaceable, split the sinks."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audit = ["numpy", "scipy"]
place = ["gliner2", "torch", "scikit-learn"]
split = ["scikit-learn", "numpy"]
dev = ["pytest"]

[project.scripts]
plumb = "plumb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumb"]
